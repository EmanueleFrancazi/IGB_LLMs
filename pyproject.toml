[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-behavior-lab"
version = "0.1.0"
description = "Incremental experimentation codebase for studying LLM behavior across initialization, training, and fine-tuning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Emanuele Francazi" }
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]
# Optional: required only to acquire externally hosted datasets. The core
# package, the default test suite, and the local text workflow never need it.
# Only what the project actually imports is declared here.
hf = [
  "datasets>=2.19",
]
# Optional: required only to draw figures from persisted experiment records.
# Loading and aggregating those records needs NumPy alone, so re-analysis stays
# possible without this extra.
analysis = [
  "matplotlib>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
