# Protocol for the initialization-distribution experiment.
#
# The question: at random initialization, how do the model's selected token
# guesses compare with the corpus token distribution, and how much of that
# comparison changes when only the initialization seed changes?
#
# Everything except the model-initialization seed is held fixed. The corpus,
# tokenizer, vocabulary, split, and evaluation positions are computed once and
# reused for every initialization, so a difference between initializations
# cannot come from looking at different text.
#
# These are first-experiment settings chosen to be informative while still
# running routinely on a laptop CPU. They are not research defaults.

experiment:
  name: initialization_distribution
  output_dir: outputs
  phase: initialization_distribution
  seed: 1234
  notes: null
  tags:
    - initialization
    - token-distribution
    - guessing-policies

logging:
  log_every_steps: 10
  evaluate_every_steps: 100
  flush_every_records: 1
  training_metrics_filename: training_metrics.jsonl
  evaluation_metrics_filename: evaluation_metrics.jsonl

checkpointing:
  # Disabled on purpose. The experiment produces one randomly initialized model
  # per seed and each is fully reconstructible from its seed plus the snapshotted
  # model config, so storing a dozen checkpoints of untrained weights would cost
  # disk without adding information.
  enabled: false
  save_every_steps: 500
  save_latest_pointer: true
  filename_width: 6

initialization:
  # The independent unit for every reported standard error. Twelve gives a
  # usable SEM without a long runtime; raise it when a difference looks marginal.
  num_initializations: 12
  base_seed: 1000
  seed_stride: 1

positions:
  # Evaluated positions = num_windows * block_size. The count controls two
  # things at once: how representative the analyzed targets are of the split
  # (figure 0), and how many tokens can possibly be guessed at all, which caps
  # the zero-guess statistic. 512 windows of 64 tokens gives 32768 positions,
  # a few hundred per token for a character vocabulary of ~150.
  num_windows: 512
  # Defaults to the data config's batching.block_size when left null. The model
  # config's max_seq_len is the hard upper bound.
  block_size: 64
  split: train

sampling:
  # Reference LLaMA inference defaults. Recorded with every result so a figure
  # can never be read without the policy that produced it.
  method: temperature_top_p
  temperature: 0.6
  top_p: 0.9
  # Independent of the model-initialization seeds on purpose: sampling noise and
  # initialization noise must stay separable.
  seed: 20240601
  # One stochastic draw per evaluated position, matching greedy exactly, so both
  # policies are summarised over the same D assignments and neither needs
  # rescaling to be compared with the other or with the uniform null.
  #
  # Consequence: within-initialization stochastic variance is not estimable and
  # is reported as "not estimated (R=1)" rather than as a misleading zero. The
  # nucleus SEM across initializations then describes the combined
  # "random initialization + one fixed sampling realization" procedure.
  #
  # Values above 1 remain supported for historical configurations, where the
  # per-replicate zero-frequency correction applies. Historical R=2/R=4 pilot
  # results stay valid records of what those protocols measured.
  num_replicates: 1
  # Draw the sampling uniforms from the position alone, so every input condition
  # and every initialization sees the same underlying randomness. This conditions
  # the input-structure comparison on one fixed stochastic realization instead of
  # letting sampling noise drift between conditions.
  common_random_numbers: true

uniform_null:
  # A uniform categorical chooser over the same eligible support K, drawing the
  # same D tokens. It answers how much of the ranked structure differs from what
  # finite sampling alone produces, and is the reference curve on figure 1.
  #
  # Each replicate is one JOINT multinomial draw. Independent binomials would
  # reproduce the marginal counts while getting the ranked histogram wrong: the
  # counts are dependent and must sum to exactly D.
  enabled: true
  # Independent of every other stream.
  seed: 20260812
  # Monte Carlo replicates -- NOT nucleus replicates. 256 gives a smooth mean and
  # a usable 95% envelope at a 32k vocabulary for well under a second and about
  # 65 MB of transient storage.
  replicates: 256

input_structure:
  # Three inputs through one initialized model: real windows, the same token
  # multiset with ordering destroyed, and Gaussian vectors at the embedding
  # boundary. Requires num_replicates: 1.
  #
  # real vs shuffled approximately isolates sequential ordering.
  # shuffled vs gaussian adds discrete token identity.
  # real vs gaussian is the broadest contrast and is NOT a clean correlation test.
  enabled: true
  # Both seeds are fixed across model initializations on purpose: the controls
  # must not vary with the weights.
  shuffle_seed: 60001
  gaussian_seed: 60002

runtime:
  # Windows per forward pass. Affects memory only, never the result: the
  # measurement folds each batch into per-token counters and discards it, and
  # the sampling draws are indexed by position rather than by batch.
  #
  # Size it against the vocabulary. The transient logits are
  # batch x block x vocab, and nucleus truncation sorts them, which costs
  # several multiples again (the sort indices alone are int64).
  #
  #   character vocabulary (~150):   32 x 64 x 150   ~ 1 MiB    -> 32 is fine
  #   subword vocabulary (32000):    32 x 64 x 32000 ~ 250 MiB  -> use 4-8
  #
  # Override per run with --forward-batch-size.
  forward_batch_size: 32
