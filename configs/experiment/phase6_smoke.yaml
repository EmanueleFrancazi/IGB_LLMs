# Phase 6 experiment-persistence smoke-test configuration.
# Interval fields used by later training phases are intentionally not included
# until a training loop exists.

experiment:
  name: phase6_smoke
  output_dir: outputs
  phase: phase6_logging_checkpointing
  seed: 1234
  notes: "Lightweight CPU smoke test for local experiment persistence."
  tags:
    - phase6
    - smoke-test

logging:
  log_every_steps: 10
  evaluate_every_steps: 100
  flush_every_records: 1
  training_metrics_filename: training_metrics.jsonl
  evaluation_metrics_filename: evaluation_metrics.jsonl

checkpointing:
  enabled: true
  save_every_steps: 500
  save_latest_pointer: true
  filename_width: 6
