# Tiny local text data config for lightweight checks.
# This remains the default path for tests and CPU-only smoke runs.

dataset:
  source_type: local_text
  name: tiny_local_text
  path: data/raw/tiny_corpus.txt
  val_fraction: 0.2

tokenizer:
  type: char

batching:
  batch_size: 4
  block_size: 16

runtime:
  seed: 1234
  device: auto
