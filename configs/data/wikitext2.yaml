# WikiText-2 (raw) for standard language-modeling checks.
#
# Requires the optional dependency:
#   python3 -m pip install -e ".[hf]"
#
# The dataset contents are never committed. On first use the corpus is
# downloaded into the external data root and prepared there; later runs reuse
# that copy without any network access.
#
# This config is NOT runnable end to end against configs/model/tiny_llama.yaml
# as shipped. The character tokenizer builds its vocabulary from the loaded
# text, and WikiText contains far more distinct characters than the tiny model's
# vocab_size: 256. Raise model.params.vocab_size before running an experiment on
# this dataset. Preparing the dataset itself works regardless.

dataset:
  name: wikitext2_raw_train1k
  source: huggingface
  repo_id: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  split: train[:1000]
  # Unpinned. The prepared manifest records the fingerprint and version that
  # were actually materialized; read them after the first real acquisition and
  # pin this field to make the corpus reproducible from upstream.
  revision: null
  text_field: text
  max_examples: 1000
  max_characters: 200000
  document_separator: "\n\n"
  val_fraction: 0.1
  verify: false

tokenizer:
  type: char

batching:
  batch_size: 4
  block_size: 16

runtime:
  seed: 1234
  device: auto
