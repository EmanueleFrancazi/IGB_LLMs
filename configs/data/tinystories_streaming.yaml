# TinyStories config for optional small-model language experiments.
# This config uses streaming and a small example cap to avoid a full local copy.
# Requires internet access and the optional Hugging Face dependency:
#   python3 -m pip install -e ".[hf]"

dataset:
  source_type: huggingface
  name: roneneldan/TinyStories
  subset: null
  split: train
  text_field: text
  val_fraction: 0.1
  max_examples: 200
  max_characters: 200000
  document_separator: "\n\n"
  streaming: true

tokenizer:
  type: char

batching:
  batch_size: 4
  block_size: 16

runtime:
  seed: 1234
  device: auto
