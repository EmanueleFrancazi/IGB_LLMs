# Tiny LLaMA-style config sized for a realistic subword vocabulary.
#
# Identical to tiny_llama.yaml in every architectural respect -- same hidden
# dimension, layer count, attention heads, KV heads, and feed-forward structure.
# Only vocab_size changes, because the input embedding and the output logits
# must span the tokenizer's full canonical vocabulary.
#
# The weights remain randomly initialized. No pretrained model is ever loaded;
# the tokenizer is the only pretrained component in the experiment.
#
# 32000 matches the mistralai/Mistral-7B-v0.1 tokenizer. Validate the match at
# runtime rather than trusting this comment: the experiment script compares the
# loaded tokenizer against this value and refuses to run when they disagree.
#
# The vocabulary dominates the parameter count here: two 32000x128 matrices are
# about 8.2M parameters, against roughly 0.4M for the two transformer blocks.

model:
  name: llama_tiny
  params:
    vocab_size: 32000
    dim: 128
    n_layers: 2
    n_heads: 4
    n_kv_heads: 2
    multiple_of: 64
    ffn_dim_multiplier: null
    norm_eps: 1.0e-5
    max_batch_size: 8
    max_seq_len: 64
    rope_theta: 10000.0

runtime:
  seed: 1234
  device: auto
